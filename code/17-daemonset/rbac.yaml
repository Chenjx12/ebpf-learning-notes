# RBAC — 给 ebpf-detector 的 ServiceAccount 和权限
# 对应笔记: docs/Three-扩展/WEEK 2.md
#
# eBPF 程序运行需要:
#   - privileged PodSecurity (在 DaemonSet 中定义)
#   - CAP_SYS_ADMIN + CAP_BPF (加载 eBPF 程序)
#   - hostPID + hostNetwork (监控整个节点)
#
# RBAC 这里主要是为 Week 4 的 K8s API 响应做准备
# (删除 Pod / 应用 NetworkPolicy 需要 RBAC 权限)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebpf-detector
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ebpf-detector
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ebpf-detector
subjects:
  - kind: ServiceAccount
    name: ebpf-detector
    namespace: default
roleRef:
  kind: ClusterRole
  name: ebpf-detector
  apiGroup: rbac.authorization.k8s.io
